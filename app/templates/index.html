<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Commodity Price Prediction</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>

            Commodity Price Prediction

        </h1>

        <form action="/predict" method="POST">

            <select
                name="commodity"
                required
            >

                <option value="">

                    Select Commodity

                </option>

                <option value="Onion">

                    Onion

                </option>

                <option value="Brinjal">

                    Brinjal

                </option>

                <option value="Cabbage">

                    Cabbage

                </option>

                <option value="Cauliflower">

                    Cauliflower

                </option>

                <option value="Rice">

                    Rice

                </option>

                <option value="Wheat">

                    Wheat

                </option>

            </select>

            <input
                type="number"
                name="days"
                placeholder="Enter Number of Days"
                required
            >

            <button type="submit">

                Predict Price

            </button>

        </form>

        {% if prediction %}

        <div class="result">

            <h2>

                {{ commodity }} predicted wholesale price
                after {{ days }} days:

                ₹ {{ prediction }} per quintal

            </h2>

            <h2>

                Approx retail price:

                ₹ {{ retail_price }} per kg

            </h2>

        </div>

        {% endif %}

    </div>

</body>

</html>
